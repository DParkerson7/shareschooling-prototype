# Free web service for the ShareSchooling community API.
# The Postgres database already exists in David's workspace:
#   name: shareschooling-db
#   region: ohio
#   Postgres 18
#   database: shareschooling_db
#   user: shareschooling_db_user
# This file does not create a database. Syncing it must not add a second one.
# DATABASE_URL uses connectionString, which is the private (internal) URL.
# The web service stays in ohio so that URL works. Plan stays free.
# Do not put the database password or TOKEN_SECRET in this file.

services:
  - type: web
    name: shareschooling-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT api.wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shareschooling-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: David
      - key: CORS_ORIGINS
        value: https://dparkerson7.github.io
      - key: PYTHON_VERSION
        value: "3.12.8"
